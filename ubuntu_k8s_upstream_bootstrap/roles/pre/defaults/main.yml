---
# defaults file for pre (Ubuntu - vanilla Kubernetes)
# Ubuntu node preparation for vanilla Kubernetes (kubeadm)
# apt-based counterpart of the Fedora pre role (no dnf/firewalld/SELinux).
# Ubuntu runs AppArmor (Kubernetes-compatible defaults), so no SELinux tasks here.

pre_hostname: ""
pre_update_system: true
pre_disable_swap: true
pre_firewall_manage: true
pre_firewall_allow_ssh_port: "22/tcp"
pre_base_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - software-properties-common
  - iptables
  - iproute2
  - conntrack
  - socat
  - ebtables
  - ethtool
pre_kernel_modules:
  - overlay
  - br_netfilter
pre_sysctl_params:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1
  net.ipv4.conf.all.forwarding: 1
  net.ipv4.conf.default.forwarding: 1