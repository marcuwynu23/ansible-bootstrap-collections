---
# Uninstalls vanilla Kubernetes worker on the [worker] group.
# Also cleans up OS preparation (firewall, sysctl, kernel modules, swap, etc.)
# Usage:
#   ansible-playbook -i inventory.ini playbooks/uninstall-worker.yml
- name: Uninstall vanilla Kubernetes worker node on Ubuntu
  hosts: worker
  become: true
  vars:
    k8s_state: absent
    k8s_node_role: worker
    containerd_state: absent
    # Pre role cleanup
    pre_firewall_manage: true
    pre_disable_swap: false  # Don't re-enable swap automatically
    pre_update_system: false
  roles:
    - roles/kubernetes
    - roles/containerd
    - roles/pre
  tasks:
    - name: "Re-enable swap (optional - set pre_disable_swap: true to re-enable)"
      command: swapon -a
      become: true
      ignore_errors: true
      changed_when: false
      when: pre_disable_swap | default(false) | bool

    - name: Remove Kubernetes sysctl config
      file:
        path: /etc/sysctl.d/99-k8s.conf
        state: absent
      become: true

    - name: Remove kernel modules config
      file:
        path: /etc/modules-load.d/k8s.conf
        state: absent
      become: true

    - name: Unload kernel modules (br_netfilter, overlay)
      modprobe:
        name: "{{ item }}"
        state: absent
      loop:
        - br_netfilter
        - overlay
      become: true
      ignore_errors: true

    - name: Reload sysctl after cleanup
      command: sysctl --system
      become: true
      changed_when: false

    - name: Remove ufw rules for Kubernetes ports
      command: "ufw delete allow {{ item }}"
      loop:
        - 10250/tcp
        - 10255/tcp
        - 30000:32767/tcp
        - 30000:32767/udp
      become: true
      ignore_errors: true
      changed_when: false
      when: pre_firewall_manage | bool

    - name: Remove containerd ufw rules if any
      command: "ufw delete allow {{ item }}"
      loop:
        - 2375/tcp
        - 2376/tcp
      become: true
      ignore_errors: true
      changed_when: false
      when: pre_firewall_manage | bool