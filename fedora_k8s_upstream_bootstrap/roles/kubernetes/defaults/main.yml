---
# defaults file for kubernetes (Fedora - vanilla upstream Kubernetes)
# Installs kubeadm, kubelet, kubectl from official Kubernetes yum repositories.
# Configures kubelet and initializes/joins cluster via kubeadm.

# Node role: "control-plane" for master, "worker" for worker nodes.
k8s_node_role: control-plane

# State: present to install/configure, absent to remove.
k8s_state: present

# Kubernetes version to install (e.g., "1.37.0-150500.1.1", "1.36.3-150500.1.1").
# Empty string "" means latest available in the configured repository.
k8s_version: ""

# Kubernetes yum repository base URL (official upstream).
# Uses the official pkgs.k8s.io repository. Major version is inserted by the task.
k8s_yum_repo_base_url: "https://pkgs.k8s.io/core:/stable:/v"

# Major version for repository (e.g., "1.37", "1.36"). Used to construct repo URL.
# If empty, derived from k8s_version or defaults to latest stable.
k8s_major_version: ""

# Repository GPG key base URL.
k8s_yum_gpgkey_base_url: "https://pkgs.k8s.io/core:/stable:/v"

# Exclude packages from updates (to prevent accidental upgrades).
k8s_yum_exclude: "kubelet kubeadm kubectl kubernetes-cni"

# Container Runtime Interface socket for kubelet.
# containerd: unix:///run/containerd/containerd.sock
# cri-o: unix:///run/crio/crio.sock
k8s_cri_socket: "unix:///run/containerd/containerd.sock"

# kubelet extra args (merged into /etc/sysconfig/kubelet or KUBELET_EXTRA_ARGS).
k8s_kubelet_extra_args: ""

# kubeadm config file path (for init/join configuration).
k8s_kubeadm_config_path: /etc/kubernetes/kubeadm-config.yaml

# kubeadm config API version. v1beta3 for Kubernetes <= 1.30, v1beta4 for >= 1.31.
k8s_kubeadm_api_version: "kubeadm.k8s.io/v1beta4"

# Control plane endpoint (for HA or load balancer). Format: "host:port" or "ip:port".
# If empty, uses the node's primary IP with default port 6443.
k8s_control_plane_endpoint: ""

# Pod network CIDR (for kubeadm init). Required for control-plane.
# Example: "10.244.0.0/16" (Flannel), "192.168.0.0/16" (Calico).
k8s_pod_network_cidr: ""

# Service CIDR (for kubeadm init). Default: 10.96.0.0/12.
k8s_service_cidr: "10.96.0.0/12"

# Kubernetes API server advertise address. If empty, auto-detected.
k8s_apiserver_advertise_address: ""

# Node name (for kubeadm). If empty, uses hostname.
k8s_node_name: ""

# Token for kubeadm join (workers and additional control-planes).
# Generate with: kubeadm token generate
k8s_join_token: ""

# CA cert hash for kubeadm join (discovery-token-ca-cert-hash).
# Format: "sha256:<hash>". Get from control-plane: openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt | openssl rsa -pubin -outform der 2>/dev/null | openssl dgst -sha256 -hex | sed 's/^.* //'
k8s_discovery_token_ca_cert_hash: ""

# Certificate key for additional control-planes (kubeadm init --upload-certs).
# Generate with: kubeadm init phase upload-certs --upload-certs
k8s_certificate_key: ""

# Skip token/CA hash validation for join (insecure, for testing only).
k8s_join_insecure_skip_ca_verification: false

# Ignore preflight errors (comma-separated). Example: "NumCPU,Mem".
k8s_ignore_preflight_errors: ""

# Extra kubeadm init/join config (merged into kubeadm config YAML).
k8s_kubeadm_config_extra: {}

# Wait for control-plane to be ready after init (seconds).
k8s_wait_timeout: 300

# Manage firewall (firewalld) for Kubernetes ports.
k8s_firewall_manage: true