---
# Flannel CNI installation tasks

- name: Get latest Flannel version if not specified
  uri:
    url: "https://api.github.com/repos/flannel-io/flannel/releases/latest"
    return_content: true
  register: flannel_latest
  when:
    - cni_plugin == "flannel"
    - cni_version | length == 0

- name: Set Flannel version
  set_fact:
    cni_flannel_version: "{{ cni_version if cni_version | length > 0 else flannel_latest.json.tag_name }}"
  when: cni_plugin == "flannel"

- name: Build Flannel manifest URL
  set_fact:
    cni_flannel_url: "https://github.com/flannel-io/flannel/releases/download/{{ cni_flannel_version }}/kube-flannel.yml"

- name: Check if Flannel is already installed
  shell: |
    KUBECONFIG=/etc/kubernetes/admin.conf kubectl get daemonset kube-flannel-ds -n kube-flannel 2>/dev/null && echo "installed" || echo "not-installed"
  register: flannel_check
  changed_when: false
  when:
    - cni_plugin == "flannel"
    - cni_skip_if_already_installed | bool

- name: Download and patch Flannel manifest
  block:
    - name: Download Flannel manifest
      get_url:
        url: "{{ cni_flannel_url }}"
        dest: /tmp/kube-flannel.yml
        mode: "0644"
      register: flannel_download

    - name: Patch Flannel manifest with interface if specified
      replace:
        path: /tmp/kube-flannel.yml
        regexp: '--iface='
        replace: '--iface={{ cni_flannel_iface }}'
      when: cni_flannel_iface | length > 0

    - name: Patch Flannel backend if not vxlan
      replace:
        path: /tmp/kube-flannel.yml
        regexp: '"Backend":\s*{[^}]*"Type":\s*"vxlan"'
        replace: '"Backend": {"Type": "{{ cni_flannel_backend }}"}'
      when: cni_flannel_backend != "vxlan"

    - name: Apply Flannel manifest
      shell: |
        KUBECONFIG=/etc/kubernetes/admin.conf kubectl apply -f /tmp/kube-flannel.yml
      environment: "{{ cni_kubectl_env }}"
      register: flannel_apply
      retries: 3
      delay: 10
      until: flannel_apply is not failed

  when:
    - cni_plugin == "flannel"
    - cni_skip_if_already_installed | bool == false or flannel_check.stdout != "installed"

- name: Wait for Flannel pods to be ready
  shell: |
    KUBECONFIG=/etc/kubernetes/admin.conf kubectl wait --for=condition=Ready pod -l app=flannel -n kube-flannel --timeout={{ cni_wait_timeout }}s
  environment: "{{ cni_kubectl_env }}"
  retries: 5
  delay: 10
  when:
    - cni_plugin == "flannel"
    - cni_wait_for_ready | bool