---
# Calico CNI installation tasks

- name: Get latest Calico version if not specified
  uri:
    url: "https://api.github.com/repos/projectcalico/calico/releases/latest"
    return_content: true
  register: calico_latest
  when:
    - cni_plugin == "calico"
    - cni_calico_version | length == 0

- name: Set Calico version
  set_fact:
    cni_calico_version: "{{ cni_calico_version if cni_calico_version | length > 0 else calico_latest.json.tag_name }}"
  when: cni_plugin == "calico"

- name: Build Calico manifest URL
  set_fact:
    cni_calico_url: "https://raw.githubusercontent.com/projectcalico/calico/{{ cni_calico_version }}/manifests/calico.yaml"

- name: Check if Calico is already installed
  shell: |
    KUBECONFIG=/etc/kubernetes/admin.conf kubectl get daemonset calico-node -n kube-system 2>/dev/null && echo "installed" || echo "not-installed"
  register: calico_check
  changed_when: false
  when:
    - cni_plugin == "calico"
    - cni_skip_if_already_installed | bool

- name: Download and patch Calico manifest
  block:
    - name: Download Calico manifest
      get_url:
        url: "{{ cni_calico_url }}"
        dest: /tmp/calico.yaml
        mode: "0644"
      register: calico_download

    - name: Patch Calico manifest with pod CIDR
      replace:
        path: /tmp/calico.yaml
        regexp: '192\.168\.0\.0/16'
        replace: "{{ cni_calico_ipv4pool_cidr }}"

    - name: Patch Calico IP-in-IP setting
      replace:
        path: /tmp/calico.yaml
        regexp: 'CALICO_IPV4POOL_IPIP:\s*"[^"]*"'
        replace: 'CALICO_IPV4POOL_IPIP: "{{ cni_calico_ipv4pool_ipip }}"'

    - name: Patch Calico VXLAN setting
      replace:
        path: /tmp/calico.yaml
        regexp: 'CALICO_IPV4POOL_VXLAN:\s*"[^"]*"'
        replace: 'CALICO_IPV4POOL_VXLAN: "{{ cni_calico_ipv4pool_vxlan }}"'

    - name: Patch Calico VXLAN port
      replace:
        path: /tmp/calico.yaml
        regexp: 'VXLAN_PORT:\s*"[^"]*"'
        replace: 'VXLAN_PORT: "{{ cni_calico_vxlan_port }}"'

    - name: Patch Calico VXLAN VNI
      replace:
        path: /tmp/calico.yaml
        regexp: 'VXLAN_VNI:\s*"[^"]*"'
        replace: 'VXLAN_VNI: "{{ cni_calico_vxlan_vni }}"'

    - name: Apply Calico manifest
      shell: |
        KUBECONFIG=/etc/kubernetes/admin.conf kubectl apply -f /tmp/calico.yaml
      environment: "{{ cni_kubectl_env }}"
      register: calico_apply
      retries: 3
      delay: 10
      until: calico_apply is not failed

  when:
    - cni_plugin == "calico"
    - cni_skip_if_already_installed | bool == false or calico_check.stdout != "installed"

- name: Wait for Calico pods to be ready
  shell: |
    KUBECONFIG=/etc/kubernetes/admin.conf kubectl wait --for=condition=Ready pod -l k8s-app=calico-node -n kube-system --timeout={{ cni_wait_timeout }}s
  environment: "{{ cni_kubectl_env }}"
  retries: 5
  delay: 10
  when:
    - cni_plugin == "calico"
    - cni_wait_for_ready | bool