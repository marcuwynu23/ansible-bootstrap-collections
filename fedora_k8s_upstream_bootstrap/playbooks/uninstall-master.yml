---
# Uninstalls vanilla Kubernetes master on the [master] group.
# Also cleans up OS preparation (firewall, sysctl, kernel modules, swap, SELinux, etc.)
# Usage:
#   ansible-playbook -i inventory.ini playbooks/uninstall-master.yml
- name: Uninstall vanilla Kubernetes master node on Fedora
  hosts: master
  become: true
  vars:
    k8s_state: absent
    k8s_node_role: control-plane
    containerd_state: absent
    # Pre role cleanup
    pre_firewall_manage: true
    pre_disable_swap: false  # Don't re-enable swap automatically
    pre_update_system: false
    pre_selinux_state: "enforcing"  # Restore SELinux to enforcing
  roles:
    - roles/kubernetes
    - roles/containerd
    - roles/pre
  tasks:
    - name: "Re-enable swap (optional - set pre_disable_swap: true to re-enable)"
      command: swapon -a
      become: true
      ignore_errors: true
      changed_when: false
      when: pre_disable_swap | default(false) | bool

    - name: Remove Kubernetes sysctl config
      file:
        path: /etc/sysctl.d/99-k8s.conf
        state: absent
      become: true

    - name: Remove kernel modules config
      file:
        path: /etc/modules-load.d/k8s.conf
        state: absent
      become: true

    - name: Unload kernel modules (br_netfilter, overlay)
      modprobe:
        name: "{{ item }}"
        state: absent
      loop:
        - br_netfilter
        - overlay
      become: true
      ignore_errors: true

    - name: Reload sysctl after cleanup
      command: sysctl --system
      become: true
      changed_when: false

    - name: Remove firewalld rules for Kubernetes ports
      firewalld:
        port: "{{ item }}"
        permanent: true
        immediate: true
        state: disabled
      loop:
        - 6443/tcp
        - 2379:2380/tcp
        - 10250/tcp
        - 10251/tcp
        - 10252/tcp
        - 10255/tcp
        - 30000-32767/tcp
        - 30000-32767/udp
      become: true
      ignore_errors: true
      when: pre_firewall_manage | bool

    - name: Remove containerd firewalld rules if any
      firewalld:
        port: "{{ item }}"
        permanent: true
        immediate: true
        state: disabled
      loop:
        - 2375/tcp
        - 2376/tcp
      become: true
      ignore_errors: true
      when: pre_firewall_manage | bool

    - name: Restore SELinux to enforcing (if it was changed)
      selinux:
        policy: targeted
        state: "{{ pre_selinux_state | default('enforcing') }}"
      become: true
      when: pre_selinux_state is defined

    - name: Persist SELinux setting in /etc/selinux/config
      lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUX='
        line: "SELINUX={{ pre_selinux_state | default('enforcing') }}"
      become: true
      when: pre_selinux_state is defined

    - name: Remove Flannel CNI resources
      shell: |
        KUBECONFIG=/etc/kubernetes/admin.conf kubectl delete -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml --ignore-not-found=true 2>/dev/null || true
      become: true
      ignore_errors: true
      changed_when: false
      when: k8s_desired_state == "absent"

    - name: Remove Calico CNI resources
      shell: |
        KUBECONFIG=/etc/kubernetes/admin.conf kubectl delete -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.0/manifests/calico.yaml --ignore-not-found=true 2>/dev/null || true
      become: true
      ignore_errors: true
      changed_when: false
      when: k8s_desired_state == "absent"

    - name: Remove Cilium CNI resources
      shell: |
        KUBECONFIG=/etc/kubernetes/admin.conf cilium uninstall --timeout 60s 2>/dev/null || true
      become: true
      ignore_errors: true
      changed_when: false
      when: k8s_desired_state == "absent"

    - name: Remove Weave CNI resources
      shell: |
        KUBECONFIG=/etc/kubernetes/admin.conf kubectl delete -f "https://cloud.weave.works/k8s/net?k8s-version=$(KUBECONFIG=/etc/kubernetes/admin.conf kubectl version | base64 -w 0)" --ignore-not-found=true 2>/dev/null || true
      become: true
      ignore_errors: true
      changed_when: false
      when: k8s_desired_state == "absent"