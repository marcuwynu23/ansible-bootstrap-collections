---
# defaults file for pre (Ubuntu K8s node preparation)
pre_hostname: ""
pre_update_system: true
pre_disable_swap: true
pre_firewall_manage: true
# MicroK8s ships as a snap. Canonical's snapd is preinstalled on Ubuntu, but
# this role ensures it is present and its socket is running.
pre_manage_snap: true
# Allowed before ufw is enabled so SSH is never cut off. Set to ""
# to skip (e.g. when using a non-standard port, allow it yourself first).
pre_firewall_allow_ssh_port: "22/tcp"
pre_base_packages:
  - curl
  - iptables
  - socat
  - conntrack
  - gnupg
  - ca-certificates
  - tar
  - ufw
  - snapd
pre_kernel_modules:
  - overlay
  - br_netfilter
pre_sysctl_params:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1
# MicroK8s ports opened when pre_firewall_manage is true (ufw range syntax).
# 16443 API server (the kubeconfig endpoint), 10250/10255 kubelet,
# 25000 cluster agent (cluster join/formation), 12379 dqlite datastore,
# 4789/udp VXLAN (Calico pod network, multi-node), and 32000-32767
# NodePorts — note MicroK8s uses 32000-32767, not the 30000-32767 default.
pre_firewall_ports:
  - 16443/tcp
  - 10250/tcp
  - 10255/tcp
  - 25000/tcp
  - 12379/tcp
  - 4789/udp
  - 32000:32767/tcp
  - 32000:32767/udp
